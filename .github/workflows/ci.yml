name: Calculator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build 
        run: dotnet build Calculator/Calculator.csproj

      - name: Test
        run: dotnet test Calculator.Tests/Calculator.Tests.csproj
